name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署需要的最小权限集
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次 Pages 部署；不要在发布中途取消，否则会留下半成品
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 请与本地验证过的版本保持一致（见 README「工具链」一节）
      HUGO_VERSION: 0.167.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # enableGitInfo 依赖完整历史：浅克隆会让每页的 lastmod 退化成提交日/占位值
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没开启 Pages 时自动开启（Source 设为 GitHub Actions）。
          # 否则首次运行会在这一步报 "Get Pages site failed / Not Found"。
          enablement: true

      - name: Install Hugo
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/hugo.tar.gz"
          curl -sSL -o "${archive}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/hugo"
          sudo install -m 0755 "${RUNNER_TEMP}/hugo/hugo" /usr/local/bin/hugo
          hugo version

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        # baseURL 必须指向真实发布地址，否则 canonical / og:url / sitemap 都会指错主机。
        # configure-pages 会给出 Pages 的 base_url（项目站点含子路径）。
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
