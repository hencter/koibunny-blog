{{- /*
  站点顶栏：品牌 + 导航 + 移动端开关。
  移动端开关由 assets/js/main.js 驱动；没有 JS 时导航保持可见（见 CSS 的默认展开规则）。
*/ -}}
<div class="wrap header-inner">
  <a class="brand" href="{{ site.Home.RelPermalink }}">
    <span class="brand-mark" aria-hidden="true">N</span>
    <span class="brand-text">
      <span class="brand-name">{{ site.Title }}</span>
      {{- with site.Params.tagline }}<span class="brand-tagline">{{ . }}</span>{{ end }}
    </span>
  </a>

  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
    <span class="nav-toggle-bars" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="sr-only">切换导航</span>
  </button>

  <nav id="site-nav" class="site-nav" aria-label="主导航" data-nav>
    {{- partial "menu.html" (dict "menuID" "main" "page" .) }}
    <a class="nav-rss" href="{{ "index.xml" | relURL }}">RSS</a>
  </nav>
</div>
