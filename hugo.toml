# ─────────────────────────────────────────────────────────────────────────────
#  NEXUS — 科技风个人博客
#
#  TOML 作用域提醒：`[table]` 之后的所有裸键都属于该表。
#  所有顶层标量必须写在第一个 `[table]` 之前，否则会静默变成表内字段。
# ─────────────────────────────────────────────────────────────────────────────

# GitHub Pages 项目站点地址：https://<用户>.github.io/<仓库>/
# 本地 `hugo server` 会自动覆盖它，不需要为此改动。
# 改 GitHub 用户名或仓库名后必须同步这里：Pages 不会把旧地址重定向过来（旧地址直接 404），
# 而 canonical / og:url / og:image / sitemap 全部由它生成。
baseURL = 'https://koibunny.github.io/tech-blog/'
title = 'NEXUS'
theme = 'nexus'

locale = 'zh-CN'
defaultContentLanguage = 'zh-cn'
timeZone = 'Asia/Shanghai'

# 中文按字计数，摘要与字数统计才有意义
hasCJKLanguage = true
summaryLength = 70

enableRobotsTXT = true
enableGitInfo = true

# ── 构建环境备注 ─────────────────────────────────────────────────────────────
# 这台机器上 `%LOCALAPPDATA%\Temp\hugo_cache` 被拒绝创建，Hugo 在加载配置阶段就 panic：
#   ERROR failed to load config: mkdir C:\...\Temp\hugo_cache: Access is denied.
# 该路径由 Hugo 的 GetCacheDir 推导，命令行 --cacheDir 无法覆盖（会对其它子目录拼接成相对路径）。
# 已验证的三种绕过方式（任选其一）：
#   $env:TMPDIR = 'E:\DeepSeekHarnessWork\.tooling\hugotmp'   # 临时目录指向可写位置
#   hugo --source <站点目录> --cacheDir <绝对可写目录>
#   修复 %LOCALAPPDATA%\Temp 下的 ACL 后即可直接用 `hugo`
# GitHub Actions 跑在 Linux 上，不受影响。

# ── 参数 ─────────────────────────────────────────────────────────────────────
[params]
  tagline = '代理工作流 · 知识库 · 开源体检'
  description = 'NEXUS 是一个关于 AI 代理工作流、知识库维护与项目开源实践的个人技术博客：记录能跑起来的做法、判断的依据，以及那些文档里没写的坑。'
  author = 'koibunny'
  authorRole = 'AI 代理工作流 / 独立开发者'
  location = 'China'
  startYear = 2024

  # 中文日期用显式布局：`:date_long` 这类本地化 token 对 zh-CN 会退回英文
  dateFormat = '2006年1月2日'
  listDateFormat = '2006-01-02'

  # 社交分享图，相对 static/，模板会用 absURL 转成绝对地址
  ogImage = 'images/og-default.png'

  # 社交链接（有序列表，顺序即显示顺序）
  [[params.social]]
    name = 'GitHub'
    icon = 'github'
    url = 'https://github.com/koibunny'
  [[params.social]]
    name = 'RSS'
    icon = 'rss'
    url = '/index.xml'

  # 首页终端卡片里逐行打印的文字
  [params.hero]
    prompt = '~'
    lines = [
      'whoami',
      'koibunny — 带几个 AI 代理同时推进一堆项目',
      'cat focus.txt',
      '代理工作流 · 知识库维护 · 内容生产链路 · 开源体检',
    ]

# ── 菜单 ─────────────────────────────────────────────────────────────────────
[[menus.main]]
  name = '首页'
  pageRef = '/'
  weight = 10
[[menus.main]]
  name = '文章'
  pageRef = '/posts'
  weight = 20
[[menus.main]]
  name = '项目'
  pageRef = '/projects'
  weight = 30
[[menus.main]]
  name = '标签'
  pageRef = '/tags'
  weight = 40
[[menus.main]]
  name = '关于'
  pageRef = '/about'
  weight = 50

# ── 日期来源：优先读 git 提交，而不是手写字段 ─────────────────────────────────
[frontmatter]
  lastmod = [':git', 'lastmod', 'date']
  date = ['date', ':git']

# ── Markdown ─────────────────────────────────────────────────────────────────
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 允许正文里写原生 HTML（本站内容全部由站点作者维护）
      unsafe = true
  [markup.highlight]
    # 类名模式：配合 gen chromastyles 生成的 assets/css/syntax.css
    noClasses = false
    style = 'tokyonight-night'
    lineNumbersInTable = true
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
