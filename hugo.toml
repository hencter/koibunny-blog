# ─────────────────────────────────────────────────────────────────────────────
#  NEXUS — 科技风个人博客
#
#  TOML 作用域提醒：`[table]` 之后的所有裸键都属于该表。
#  所有顶层标量必须写在第一个 `[table]` 之前，否则会静默变成表内字段。
# ─────────────────────────────────────────────────────────────────────────────

# GitHub Pages 项目站点地址：https://<用户>.github.io/<仓库>/
# 本地 `hugo server` 会自动覆盖它，不需要为此改动。
# 改 GitHub 用户名或仓库名后必须同步这里：Pages 不会把旧地址重定向过来（旧地址直接 404），
# 而 canonical / og:url / og:image / sitemap 全部由它生成。
baseURL = 'https://koibunny.github.io/tech-blog/'
title = 'KoiBunny 的 AI 博客'
theme = 'nexus'

locale = 'zh-CN'
defaultContentLanguage = 'zh-cn'
timeZone = 'Asia/Shanghai'

# 中文按字计数，摘要与字数统计才有意义
hasCJKLanguage = true
summaryLength = 70

enableRobotsTXT = true
enableGitInfo = true

# ── 构建环境备注（2026-10-03 已修复） ───────────────────────────────────────
# 曾出现：`hugo` 在加载配置阶段直接 panic
#   ERROR failed to load config: mkdir C:\...\Temp\hugo_cache: Access is denied.
# 根因是 `%LOCALAPPDATA%\Temp\hugo_cache` 这个**目录创建**被本机策略拒绝，不是权限缺失：
# 同名目录一旦存在，Hugo 读写它完全正常。修复方式就是预建该目录。
# 该路径由 Hugo 的 GetCacheDir 推导，命令行 --cacheDir 无法覆盖（会对其它子目录拼接成相对路径）。
# 若在别的机器上复现，三种方式任选其一：
#   New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\Temp\hugo_cache"   # 首选，根治
#   $env:TMPDIR = 'E:\DeepSeekHarnessWork\.tooling\hugotmp'                    # 临时目录改到可写位置
#   hugo --source <站点目录> --cacheDir <绝对可写目录>
# GitHub Actions 跑在 Linux 上，与这条无关。

# ── 参数 ─────────────────────────────────────────────────────────────────────
[params]
  tagline = 'KoiBunny · AI LEARNING LAB'
  description = '这里记录我自己会回头查的笔记：能跑起来的实验、读过源码后的结论，以及踩过的坑。'
  heroTitle = '把 AI 说明白，也把实验跑起来'
  author = 'KoiBunny'
  authorRole = 'AI 代理工作流 / 独立开发者'
  location = 'China'
  startYear = 2024

  # 中文日期用显式布局：`:date_long` 这类本地化 token 对 zh-CN 会退回英文
  dateFormat = '2006年1月2日'
  listDateFormat = '2006-01-02'

  # 社交分享图，相对 static/，模板会用 absURL 转成绝对地址
  ogImage = 'images/og-default.png'

  # 社交链接（有序列表，顺序即显示顺序）
  # 站内地址（以 / 开头）在模板里会走 site-url.html 换成带 baseURL 前缀的绝对地址；
  # 这里不要写成别的形式，否则项目站点上会跳到域名根目录。
  [[params.social]]
    name = 'GitHub'
    icon = 'github'
    url = 'https://github.com/koibunny'
  [[params.social]]
    name = 'RSS'
    icon = 'rss'
    url = '/index.xml'

  # 首页 hero 里那条说明条的文字。不写就用模板里的缺省句。
  # heroNote = '不追热点，尽量把「为什么」写清楚；不能复现的结论，不会放在这里。'

# ── 菜单 ─────────────────────────────────────────────────────────────────────
[[menus.main]]
  name = '首页'
  pageRef = '/'
  weight = 10
[[menus.main]]
  name = '笔记文章'
  pageRef = '/posts'
  weight = 20
[[menus.main]]
  name = '项目实践'
  pageRef = '/projects'
  weight = 30
[[menus.main]]
  name = '标签'
  pageRef = '/tags'
  weight = 40
[[menus.main]]
  name = '关于我'
  pageRef = '/about'
  weight = 50

# ── 日期来源：优先读 git 提交，而不是手写字段 ─────────────────────────────────
[frontmatter]
  lastmod = [':git', 'lastmod', 'date']
  date = ['date', ':git']

# ── Markdown ─────────────────────────────────────────────────────────────────
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 允许正文里写原生 HTML（本站内容全部由站点作者维护）
      unsafe = true
  [markup.highlight]
    # 类名模式：配合 gen chromastyles 生成的 assets/css/syntax.css
    # 风格必须是浅色系——全站底色是奶油纸，深色主题的代码块会像补丁
    noClasses = false
    style = 'tokyonight-day'
    lineNumbersInTable = true
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
